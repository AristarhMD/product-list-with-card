<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
    <title>Product list with cart</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css" />
    <style type="text/tailwindcss">
      @theme {
        --font-sans: "Red Hat Text", sans-serif;
        --color-red: #c73b0f;
        --color-rose-900: #260f08;
        --color-rose-500: #87635a;
        --color-rose-400: #ad8a85;
        --color-rose-300: #caafa7;
        --color-rose-100: #f5eeec;
        --color-rose-50: #fcf8f6;
        --color-green: #1ea575;
        --color-black: #000;
        --color-white: #fff;
      }

      @layer utilities {
        /* Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
          display: none;
        }

        /* IE, Edge and Firefox */
        .no-scrollbar {
          -ms-overflow-style: none; /* IE and Edge */
          scrollbar-width: none; /* Firefox */
        }
      }

      @utility preset-1 {
        @apply text-[40px] font-bold leading-[120%];
      }

      @utility preset-2 {
        @apply text-2xl font-bold leading-[125%];
      }

      @utility preset-3 {
        @apply text-base font-bold leading-[150%];
      }

      @utility preset-4 {
        @apply text-sm font-normal leading-[150%];
      }

      @utility preset-4-bold {
        @apply text-sm font-semibold leading-[150%];
      }
    </style>
    <script src="script.js" defer type="module"></script>
  </head>
  <body class="bg-rose-50 min-h-full overflow-x-hidden">
    <div
      class="w-full xl:py-22 xl:px-10 xl:flex xl:items-center xl:justify-center xl:overflow-hidden"
    >
      <main
        class="m-6 flex flex-col gap-8 md:m-10 xl:flex-row xl:items-start xl:m-0 xl:w-[84.4%]"
      >
        <section class="flex flex-col gap-8">
          <h1 class="preset-1 text-rose-900">Dessert</h1>
          <div
            class="article-container grid grid-cols-1 gap-6 md:grid-cols-3 gap-x-6 gap-y-8"
          >
            <article class="flex flex-col gap-4">
              <div>
                <picture>
                  <source
                    media="(min-width:768px )"
                    srcset="/assets/images/image-waffle-tablet.jpg"
                  />
                  <source
                    media="(min-width:1220px )"
                    srcset="/assets/images/image-waffle-desktop.jpg"
                  />
                  <img
                    class="rounded-lg"
                    src="/assets/images/image-waffle-mobile.jpg"
                    alt="waffle photos"
                  />
                </picture>
                <button
                  class="flex items-center mx-auto gap-2 py-3 px-7 border border-rose-400 rounded-full cursor-pointer relative z-10 bg-white -mt-6.25"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="21"
                    height="20"
                    fill="none"
                    viewBox="0 0 21 20"
                  >
                    <g fill="#C73B0F" clip-path="url(#a)">
                      <path
                        d="M6.583 18.75a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5ZM15.334 18.75a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5ZM3.446 1.752a.625.625 0 0 0-.613-.502h-2.5V2.5h1.988l2.4 11.998a.625.625 0 0 0 .612.502h11.25v-1.25H5.847l-.5-2.5h11.238a.625.625 0 0 0 .61-.49l1.417-6.385h-1.28L16.083 10H5.096l-1.65-8.248Z"
                      />
                      <path
                        d="M11.584 3.75v-2.5h-1.25v2.5h-2.5V5h2.5v2.5h1.25V5h2.5V3.75h-2.5Z"
                      />
                    </g>
                    <defs>
                      <clipPath id="a">
                        <path fill="#fff" d="M.333 0h20v20h-20z" />
                      </clipPath>
                    </defs>
                  </svg>
                  <p>Add to Cart</p>
                </button>
              </div>
              <div>
                <p class="preset-4 text-rose-500">Waffle</p>
                <p class="preset-3 text-rose-900">Waffle with Berries</p>
                <p class="preset-3 text-red">$6.50</p>
              </div>
            </article>
          </div>
        </section>

        <section
          class="p-6 bg-white rounded-xl flex flex-col gap-6 grow-0 shrink-0 basis-[28.19%]"
        >
          <p class="preset-2 text-red">
            Your cart (<span class="cart-counter">0</span>)
          </p>

          <div class="cart-container py-4 flex flex-col gap-4 items-center">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="128"
              height="128"
              fill="none"
              viewBox="0 0 128 128"
            >
              <path
                fill="#260F08"
                d="M8.436 110.406c0 1.061 4.636 2.079 12.887 2.829 8.252.75 19.444 1.171 31.113 1.171 11.67 0 22.861-.421 31.113-1.171 8.251-.75 12.887-1.768 12.887-2.829 0-1.061-4.636-2.078-12.887-2.828-8.252-.75-19.443-1.172-31.113-1.172-11.67 0-22.861.422-31.113 1.172-8.251.75-12.887 1.767-12.887 2.828Z"
                opacity=".15"
              />
              <path
                fill="#87635A"

              />
              <path
                fill="#AD8A85"
                d="m74.561 44.142 47.147-5.754 1.435 11.778-47.142 5.758-1.44-11.782Z"
              />
              <path
                fill="#CAAFA7"
                d="M85.636 36.78a2.4 2.4 0 0 0-2.667-2.054 2.375 2.375 0 0 0-2.053 2.667l.293 2.347a3.574 3.574 0 0 1-7.066.88l-1.307-10.667 14.48-16.88c19.253-.693 34.133 3.6 35.013 10.8l1.28 10.533a1.172 1.172 0 0 1-1.333 1.307 4.696 4.696 0 0 1-3.787-4.08 2.378 2.378 0 1 0-4.72.587l.294 2.346a2.389 2.389 0 0 1-.484 1.755 2.387 2.387 0 0 1-1.583.899 2.383 2.383 0 0 1-1.755-.484 2.378 2.378 0 0 1-.898-1.583 2.371 2.371 0 0 0-1.716-2.008 2.374 2.374 0 0 0-2.511.817 2.374 2.374 0 0 0-.493 1.751l.293 2.373a4.753 4.753 0 0 1-7.652 4.317 4.755 4.755 0 0 1-1.788-3.17l-.427-3.547a2.346 2.346 0 0 0-2.666-2.053 2.4 2.4 0 0 0-2.08 2.667l.16 1.173a2.378 2.378 0 1 1-4.72.587l-.107-1.28Z"
              />
              <path
                stroke="#fff"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width=".974"
                d="m81.076 28.966 34.187-4.16"
              />
              <path
                fill="#87635A"
                d="M7.45 51.793c-.96 8.48 16.746 17.44 39.466 19.947 22.72 2.506 42.08-2.16 43.04-10.667l-3.947 35.493c-.96 8.48-20.24 13.334-43.04 10.667S2.463 95.74 3.423 87.18l4.026-35.387Z"
              />
              <path
                fill="#AD8A85"
                d="M5.823 65.953c-.96 8.453 16.746 17.44 39.573 20.027 22.827 2.586 42.053-2.187 43.013-10.667L87.076 87.1c-.96 8.48-20.24 13.333-43.04 10.666C21.236 95.1 3.53 86.22 4.49 77.74l1.334-11.787Z"
              />
              <path
                fill="#CAAFA7"
                d="M60.836 42.78a119.963 119.963 0 0 0-10.347-1.627c-24-2.667-44.453 1.893-45.333 10.373l-2.133 18.88a3.556 3.556 0 1 0 7.066.8 3.574 3.574 0 1 1 7.094.8l-.8 7.094a5.93 5.93 0 1 0 11.786 1.333 3.556 3.556 0 0 1 7.067.8l-.267 2.347a3.573 3.573 0 0 0 7.094.826l.133-1.2a5.932 5.932 0 1 1 11.787 1.36l-.4 3.52a3.573 3.573 0 0 0 7.093.827l.933-8.267a1.174 1.174 0 0 1 1.307-.906 1.146 1.146 0 0 1 1.04 1.306 5.947 5.947 0 0 0 11.813 1.334l.534-4.72a3.556 3.556 0 0 1 7.066.8 3.573 3.573 0 0 0 7.094.826l1.786-15.546a2.373 2.373 0 0 0-2.08-2.667L44.143 55.74l16.693-12.96Z"
              />
              <path
                fill="#87635A"
                d="m59.156 57.66 1.68-14.88-16.827 13.173 15.147 1.707Z"
              />
              <path
                stroke="#fff"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width=".974"
                d="M9.796 52.06c-.667 5.866 16.24 12.586 37.733 15.04 14.774 1.68 27.867.906 34.854-1.654"
              />
            </svg>
            <p class="preset-4-bold text-rose-500">
              Your added items will appear here
            </p>
          </div>
        </section>

        <section
          class="complet-order fixed inset-0 bg-black/50 flex items-end hidden z-20 md:items-center md:justify-center"
        >
          <div
            class="no-scrollbar px-6 pt-10 pb-6 bg-white flex flex-col gap-8 mt-24 w-full max-h-[calc(100vh-6rem)] rounded-t-xl overflow-y-scroll md:w-[89.58%] md:h-auto md:m-0 md:p-10 md:rounded-xl xl:w-[41.11%] xl:max-h-auto"
          >
            <div>
              <svg
                class="mb-6"
                width="48"
                height="48"
                viewBox="0 0 48 48"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M21 32.121L13.5 24.6195L15.6195 22.5L21 27.879L32.3775 16.5L34.5 18.6225L21 32.121Z"
                  fill="#1EA575"
                />
                <path
                  d="M24 3C19.8466 3 15.7865 4.23163 12.333 6.53914C8.8796 8.84665 6.18798 12.1264 4.59854 15.9636C3.0091 19.8009 2.59323 24.0233 3.40352 28.0969C4.21381 32.1705 6.21386 35.9123 9.15077 38.8492C12.0877 41.7861 15.8295 43.7862 19.9031 44.5965C23.9767 45.4068 28.1991 44.9909 32.0364 43.4015C35.8736 41.812 39.1534 39.1204 41.4609 35.667C43.7684 32.2135 45 28.1534 45 24C45 18.4305 42.7875 13.089 38.8493 9.15076C34.911 5.21249 29.5696 3 24 3ZM24 42C20.4399 42 16.9598 40.9443 13.9997 38.9665C11.0397 36.9886 8.73256 34.1774 7.37018 30.8883C6.0078 27.5992 5.65134 23.98 6.34587 20.4884C7.04041 16.9967 8.75474 13.7894 11.2721 11.2721C13.7894 8.75473 16.9967 7.0404 20.4884 6.34587C23.98 5.65133 27.5992 6.00779 30.8883 7.37017C34.1774 8.73255 36.9886 11.0397 38.9665 13.9997C40.9443 16.9598 42 20.4399 42 24C42 28.7739 40.1036 33.3523 36.7279 36.7279C33.3523 40.1036 28.7739 42 24 42Z"
                  fill="#1EA575"
                />
              </svg>

              <div>
                <p class="preset-1 text-rose-900 mb-2">Order Confirmed</p>
                <p class="font-normal text-base text-rose-500">
                  We hope you enjoy your food!
                </p>
              </div>
            </div>

            <div
              class="complete-order-cart p-6 bg-rose-50 rounded-lg flex flex-col gap-6"
            >
              <div class="complete-cart-items flex flex-col gap-4"></div>
              <hr class="border-rose-100" />
              <p
                class="preset-4 text-rose-900 flex justify-between items-center"
              >
                Order Total
                <span class="complet-cart-price preset-2">$48.00</span>
              </p>
            </div>
            <button
              class="new-order w-full py-4 px-6 bg-red rounded-full cursor-pointer relative before:absolute before:content-[''] before:inset-0 before:bg-black/25 before:opacity-0 hover:before:opacity-100 before:rounded-full"
              type="button"
            >
              <span class="relative z-10 text-white preset-3">
                Start New Order
              </span>
            </button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
